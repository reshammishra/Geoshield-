<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Enrollment – GeoShield Intelligence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: radial-gradient(circle at 50% 30%, #152036 0%, #060A12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-top: 4px solid var(--color-flood);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:2.5rem; margin-bottom:0.5rem;">🛡️</div>
      <h1 style="font-size:1.4rem; font-weight:800; letter-spacing:-0.02em;">Operator Registration</h1>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;">Enroll new personnel into GeoShield platform</p>
    </div>

    {% if error %}
      <div style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#FCA5A5; padding:0.65rem 0.85rem; border-radius:var(--radius-sm); font-size:0.82rem; margin-bottom:1rem;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/auth/signup">
      <div class="form-group">
        <label class="form-label">Operator Handle (Username)</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. j_doe" required autofocus />
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="officer@disaster.gov.in" required />
      </div>

      <div class="form-group">
        <label class="form-label">Operational Role</label>
        <select name="role" class="form-control">
          <option value="analyst">Disaster Data Analyst</option>
          <option value="operator">Emergency Response Operator</option>
          <option value="admin">System Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Password (min 6 characters)</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem; font-size:0.95rem; margin-top:0.5rem;">
        Complete Enrollment
      </button>
    </form>

    <div style="margin-top:1.5rem; text-align:center; font-size:0.8rem; color:var(--text-muted);">
      Already authorized? <a href="/auth/login" style="color:var(--text-highlight); text-decoration:none; font-weight:600;">Operator Sign In</a>
    </div>
  </div>
</body>
</html>
